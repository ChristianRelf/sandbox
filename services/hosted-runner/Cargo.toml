[package]
name = "sandbox-hosted-runner"
version = "0.4.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
sandbox-engine = { path = "../../src-tauri/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }

