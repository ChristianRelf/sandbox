[package]
name = "sandbox-server-runner"
version = "0.7.2-beta.2"
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive","env"] }
ed25519-dalek = { version = "3", features = ["pkcs8","rand_core","alloc"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
sandbox-engine = { path = "../../src-tauri/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4","serde"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
