version: 2
updates:
  # Security updates remain enabled even when version-update PRs are disabled
  # with open-pull-requests-limit: 0. Group fixes to keep review manageable.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/docs
      - /browser-sidecar
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 0
    groups:
      npm-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /services/hosted-runner
      - /agents/server
      - /plugins/first-party/guest
      - /examples/plugins/internal-approval/guest
      - /examples/plugins/weather-data/guest
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: Europe/London
    open-pull-requests-limit: 0
    groups:
      cargo-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 0
    groups:
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
