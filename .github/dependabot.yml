version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
      day: wednesday
      time: "06:15"
      timezone: Europe/London
    groups:
      docs-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /browser-sidecar
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: Europe/London
    groups:
