name: Feature request
description: Propose a focused improvement to sndbox
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before prescribing an implementation. Discuss substantial work with a maintainer before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and a concrete example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds and why they are insufficient.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and compatibility considerations
      description: Note new permissions, data flows, network access, secrets, breaking changes, or migrations.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and documentation for this request.
          required: true
        - label: I agree to follow the project Code of Conduct.
          required: true
