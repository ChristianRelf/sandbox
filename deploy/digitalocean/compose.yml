services:
  website:
    image: ghcr.io/christianrelf/sandbox-marketing:${SANDBOX_VERSION:-0.7.0-beta.1}
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3100
      SANDBOX_RELEASE_MANIFEST_URL: ${SANDBOX_RELEASE_MANIFEST_URL:-https://github.com/ChristianRelf/sandbox/releases/download/v0.7.0-beta.1/release-manifest.json}
    ports:
      - "${SANDBOX_HTTP_BIND:-127.0.0.1}:3100:3100"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m

  runner:
    image: ghcr.io/christianrelf/sandbox-server-runner:${SANDBOX_VERSION:-0.7.0-beta.1}
    profiles: [runner]
    restart: unless-stopped
    command: ["--config", "/etc/sandbox/runner.toml", "run"]
    volumes:
      - ./runner.toml:/etc/sandbox/runner.toml:ro
      - ./data:/var/lib/sandbox-runner
      - ./automation:/srv/automation
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 192
    mem_limit: 384m
